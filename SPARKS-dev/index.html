<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPARKS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/png" href="/bp-planner/assets/images/bp_favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html,
    body,
    #root {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
    }

    /* Custom Scrollbar for "Archive" feel */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    @media print {
      @page {
        margin: 0.5cm;
      }

      body {
        background: white;
        color: black;
      }

      .print\:hidden {
        display: none !important;
      }

      .print\:shadow-none {
        box-shadow: none !important;
      }

      .print\:border-none {
        border: none !important;
      }

      .print\:w-full {
        width: 100% !important;
      }

      .print\:text-slate-800,
      .print\:text-slate-700 {
        color: black !important;
      }

      .print\:bg-white {
        background: white !important;
      }

      .print\:break-inside-avoid {
        break-inside: avoid;
      }
    }
  </style>

    "react": "https://aistudiocdn.com/react@^19.2.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.32.0"
  }
}
</script>

</head>

<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
