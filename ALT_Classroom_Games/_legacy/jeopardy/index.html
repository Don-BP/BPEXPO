<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeopardy - Brain Power</title>
    <link rel="stylesheet" href="../style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        .btn-back {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 0.5rem 1.5rem;
            border-radius: var(--radius-full);
            cursor: pointer;
            font-family: var(--font-heading);
            font-weight: 500;
            transition: all var(--transition-fast);
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(-4px);
        }

        .jeopardy-board {
            max-width: 1200px;
            margin: var(--space-2xl) auto;
            padding: 0 var(--space-md);
        }

        .categories {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: var(--space-sm);
            margin-bottom: var(--space-sm);
        }

        .category-header {
            background: linear-gradient(135deg, #3498DB 0%, #5DADE2 100%);
            color: white;
            padding: var(--space-md);
            text-align: center;
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 1.1rem;
            border-radius: var(--radius-md);
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .questions-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: var(--space-sm);
        }

        .question-tile {
            aspect-ratio: 1.2;
            background: linear-gradient(135deg, #1565C0 0%, #1976D2 100%);
            color: #FFD700;
            font-family: var(--font-heading);
            font-size: 2.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-normal);
            box-shadow: var(--shadow-md);
        }

        .question-tile:hover:not(.answered) {
            transform: scale(1.05);
            box-shadow: var(--shadow-lg);
        }

        .question-tile.answered {
            background: #37474F;
            color: #78909C;
            cursor: default;
            opacity: 0.5;
        }

        .scores {
            display: flex;
            justify-content: center;
            gap: var(--space-lg);
            margin-bottom: var(--space-xl);
            flex-wrap: wrap;
        }

        .team-score {
            background: var(--surface);
            padding: var(--space-md) var(--space-lg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            text-align: center;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all var(--transition-fast);
        }

        .team-score.active {
            border-color: #3498DB;
            transform: scale(1.05);
        }

        .team-name {
            font-family: var(--font-heading);
            font-size: 1.1rem;
            margin-bottom: var(--space-xs);
        }

        .team-points {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .modal {
            max-width: 700px;
        }

        .question-display {
            font-size: 1.5rem;
            text-align: center;
            padding: var(--space-xl);
            background: var(--background);
            border-radius: var(--radius-md);
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .point-value {
            color: #FFD700;
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: var(--space-md);
        }

        @media (max-width: 768px) {

            .categories,
            .questions-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .question-tile {
                font-size: 1.5rem;
            }

            .category-header {
                font-size: 0.9rem;
                min-height: 60px;
            }
        }
    </style>
</head>

<script src="../utils/audio.js"></script>
</head>

<body>
    <header class="game-header header-jeopardy">
        <div class="container">
            <button class="btn-back" onclick="window.location.href='../index.html'">← Back to Hub</button>
            <h1>Jeopardy</h1>
            <div class="right-actions">
                <button class="btn-icon" onclick="toggleMute()" title="Toggle Sound">🔊</button>
                <button class="btn-icon" onclick="window.location.href='teacher.html'" title="Teacher Mode">⚙️</button>
            </div>
        </div>
    </header>

    <div class="jeopardy-board">
        <div class="scores" id="scores"></div>

        <div class="categories" id="categories"></div>
        <div class="questions-grid" id="questions-grid"></div>
    </div>

    <!-- Question Modal -->
    <div id="question-modal" class="modal-overlay">
        <div class="modal">
            <div class="point-value" id="point-value"></div>
            <div class="question-display" id="question-display"></div>
            <div class="modal-footer" style="margin-top: var(--space-xl);">
                <button class="btn btn-success" onclick="answerCorrect()">✓ Correct</button>
                <button class="btn btn-danger" onclick="answerWrong()">✗ Wrong</button>
                <button class="btn btn-secondary" onclick="closeModal()">Skip</button>
            </div>
        </div>
    </div>

    <!-- Daily Double Modal -->
    <div id="daily-double-modal" class="modal-overlay">
        <div class="modal text-center">
            <h2 style="color: #FFD700; font-size: 2.5rem; text-shadow: 2px 2px 0 #000;">DAILY DOUBLE!</h2>
            <p style="font-size: 1.25rem;">Place your wager!</p>

            <div style="margin: var(--space-lg) 0;">
                <input type="number" id="wager-input" class="form-input"
                    style="font-size: 2rem; width: 200px; text-align: center;" placeholder="Points">
                <p id="wager-max" style="font-size: 0.9rem; color: #666; margin-top: 0.5rem;">Max Wager: $1000</p>
            </div>

            <div class="modal-footer">
                <button class="btn btn-primary" onclick="submitWager()">Bet!</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>

</html>
