<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Mode - Jeopardy</title>
    <link rel="stylesheet" href="../style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        .teacher-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--space-xl) var(--space-lg);
        }

        .editor-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            margin-bottom: var(--space-lg);
            box-shadow: var(--shadow-md);
        }

        .board-grid-editor {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: var(--space-sm);
            margin-top: var(--space-md);
        }

        .category-input {
            width: 100%;
            padding: 0.5rem;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            text-align: center;
            font-weight: 600;
        }

        .question-slot {
            aspect-ratio: 1.5;
            background: var(--background);
            border: 2px dashed var(--border);
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition-fast);
            padding: 0.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-light);
            overflow: hidden;
        }

        .question-slot:hover {
            border-color: var(--primary);
            background: rgba(255, 107, 107, 0.05);
        }

        .question-slot.filled {
            background: #E8F8F5;
            border-style: solid;
            border-color: var(--success);
            color: var(--text-dark);
        }

        .slot-points {
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.25rem;
        }

        .slot-preview {
            font-size: 0.8rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .form-group {
            margin-bottom: var(--space-md);
        }

        .form-label {
            font-weight: 600;
            margin-bottom: var(--space-xs);
            display: block;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
        }

        .saved-list {
            display: grid;
            gap: var(--space-sm);
        }

        .saved-item {
            background: var(--background);
            padding: var(--space-md);
            border-radius: var(--radius-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-textarea {
            width: 100%;
            min-height: 150px;
            padding: 1rem;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            font-family: var(--font-body);
            font-size: 1.1rem;
            resize: vertical;
        }
    </style>
</head>

<body>
    <header class="game-header" style="background: linear-gradient(135deg, #3498DB 0%, #5DADE2 100%);">
        <div class="container">
            <button class="btn-back" onclick="window.location.href='index.html'">← Back to Game</button>
            <h1>⚙️ Teacher Mode - Jeopardy</h1>
        </div>
    </header>

    <div class="teacher-container">
        <!-- Editor Section -->
        <div class="editor-card">
            <div
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-lg);">
                <div style="flex: 1; margin-right: var(--space-md);">
                    <label class="form-label">Board Name</label>
                    <input type="text" id="board-name" class="form-input" placeholder="e.g. Unit 5 Review">
                </div>
                <div>
                    <button class="btn btn-secondary" onclick="newBoard()">New</button>
                    <button class="btn btn-primary" onclick="saveBoard()">💾 Save Board</button>
                </div>
            </div>

            <div class="board-grid-editor" id="editor-grid">
                <!-- Will be populated by JS -->
            </div>
        </div>

        <!-- Saved Boards -->
        <div class="editor-card">
            <h2>Saved Boards</h2>
            <div id="saved-list" class="saved-list"></div>
        </div>

        <!-- Import/Export -->
        <div class="editor-card">
            <h2>Import / Export</h2>
            <div class="form-group">
                <textarea id="json-io" class="form-input" rows="4" placeholder="Paste JSON here..."></textarea>
            </div>
            <button class="btn btn-secondary" onclick="exportBoards()">Export All</button>
            <button class="btn btn-accent" onclick="importBoards()">Import</button>
        </div>
    </div>

    <!-- Edit Question Modal -->
    <div id="edit-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2>Edit Question</h2>
                <button class="modal-close" onclick="closeEditModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p id="edit-meta" style="color: var(--text-light); margin-bottom: var(--space-sm);">Category: ... |
                    Points: ...</p>
                <label class="form-label">Question Text</label>
                <textarea id="edit-question-text" class="modal-textarea"
                    placeholder="Enter the question here..."></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="saveCurrentQuestion()">Done</button>
            </div>
        </div>
    </div>

    <script>
        let currentBoard = {
            id: null,
            name: '',
            categories: ['', '', '', '', ''],
            questions: [
                ['', '', '', '', ''],
                ['', '', '', '', ''],
                ['', '', '', '', ''],
                ['', '', '', '', ''],
                ['', '', '', '', '']
            ]
        };

        let editingCell = { row: 0, col: 0 };

        function init() {
            renderEditor();
            loadSavedList();
        }

        function renderEditor() {
            const grid = document.getElementById('editor-grid');
            grid.innerHTML = '';

            // Categories Row
            currentBoard.categories.forEach((cat, index) => {
                const input = document.createElement('input');
                input.className = 'category-input';
                input.placeholder = `Category ${index + 1}`;
                input.value = cat;
                input.onchange = (e) => currentBoard.categories[index] = e.target.value;
                grid.appendChild(input);
            });

            // Questions Grid
            const points = [100, 200, 300, 400, 500];
            for (let row = 0; row < 5; row++) {
                for (let col = 0; col < 5; col++) {
                    const cell = document.createElement('div');
                    const question = currentBoard.questions[row][col];
                    cell.className = `question-slot ${question ? 'filled' : ''}`;
                    cell.innerHTML = `
                        <div class="slot-points">$${points[row]}</div>
                        <div class="slot-preview">${question || 'Empty'}</div>
                    `;
                    cell.onclick = () => openEditModal(row, col);
                    grid.appendChild(cell);
                }
            }
        }

        function openEditModal(row, col) {
            editingCell = { row, col };
            const points = [100, 200, 300, 400, 500];
            const catName = currentBoard.categories[col] || `Category ${col + 1}`;

            document.getElementById('edit-meta').textContent = `Category: ${catName} | Points: $${points[row]}`;
            document.getElementById('edit-question-text').value = currentBoard.questions[row][col] || '';
            document.getElementById('edit-modal').classList.add('active');
            document.getElementById('edit-question-text').focus();
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.remove('active');
        }

        function saveCurrentQuestion() {
            const text = document.getElementById('edit-question-text').value.trim();
            currentBoard.questions[editingCell.row][editingCell.col] = text;
            renderEditor();
            closeEditModal();
        }

        function getSavedBoards() {
            const saved = localStorage.getItem('jeopardy_boards');
            return saved ? JSON.parse(saved) : {};
        }

        function saveBoard() {
            const name = document.getElementById('board-name').value.trim();
            if (!name) return alert('Please enter a board name');

            // Format ID from name
            const id = currentBoard.id || name.toLowerCase().replace(/[^a-z0-9]/g, '_');
            currentBoard.id = id;
            currentBoard.name = name;

            const boards = getSavedBoards();
            boards[id] = currentBoard;
            localStorage.setItem('jeopardy_boards', JSON.stringify(boards));

            loadSavedList();
            alert('Board saved!');
        }

        function loadSavedList() {
            const boards = getSavedBoards();
            const list = document.getElementById('saved-list');
            list.innerHTML = '';

            Object.keys(boards).forEach(key => {
                if (key === 'default') return; // Don't show default in edit list? Or maybe yes.
                const board = boards[key];
                const div = document.createElement('div');
                div.className = 'saved-item';
                div.innerHTML = `
                    <strong>${board.name}</strong>
                    <div>
                        <button class="btn btn-accent" onclick="loadBoard('${key}')">Edit</button>
                        <button class="btn btn-primary" onclick="playBoard('${key}')">Play</button>
                        <button class="btn btn-danger" onclick="deleteBoard('${key}')" style="padding: 0.5rem;">🗑️</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function loadBoard(id) {
            const boards = getSavedBoards();
            if (boards[id]) {
                currentBoard = JSON.parse(JSON.stringify(boards[id])); // Deep copy
                document.getElementById('board-name').value = currentBoard.name;
                renderEditor();
            }
        }

        function playBoard(id) {
            window.location.href = `index.html?board=${id}`;
        }

        function deleteBoard(id) {
            if (!confirm('Delete this board?')) return;
            const boards = getSavedBoards();
            delete boards[id];
            localStorage.setItem('jeopardy_boards', JSON.stringify(boards));
            loadSavedList();
            if (currentBoard.id === id) newBoard();
        }

        function newBoard() {
            currentBoard = {
                id: null,
                name: '',
                categories: ['', '', '', '', ''],
                questions: Array(5).fill().map(() => Array(5).fill(''))
            };
            document.getElementById('board-name').value = '';
            renderEditor();
        }

        function exportBoards() {
            const boards = getSavedBoards();
            document.getElementById('json-io').value = JSON.stringify(boards, null, 2);
        }

        function importBoards() {
            try {
                const data = JSON.parse(document.getElementById('json-io').value);
                const current = getSavedBoards();
                const merged = { ...current, ...data };
                localStorage.setItem('jeopardy_boards', JSON.stringify(merged));
                loadSavedList();
                alert('Import successful!');
            } catch (e) {
                alert('Invalid JSON');
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
