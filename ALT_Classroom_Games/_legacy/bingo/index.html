<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Bingo - ALT Classroom Games</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="game-header header-bingo">
        <div class="container">
            <button class="btn-back" onclick="window.location.href='../index.html'">← Back to Hub</button>
            <h1>Digital Bingo</h1>
            <div class="right-actions">
                <button class="btn-icon" onclick="toggleMute()" title="Sound">🔊</button>
                <button class="btn-icon" onclick="window.location.href='teacher.html'" title="Teacher Mode">⚙️</button>
            </div>
        </div>
    </header>

    <div class="game-container">
        <!-- Controls Bar -->
        <div class="controls-bar" style="margin-bottom: 2rem; display: flex; justify-content: center; gap: 1rem;">
            <button class="btn btn-secondary" onclick="generateCard('NUMBER')">Numbers</button>
            <button class="btn btn-primary" onclick="generateCard('FRUIT')">Fruits</button>
            <button class="btn btn-accent" onclick="generateCard('ANIMAL')">Animals</button>
        </div>

        <div class="bingo-board-container">
            <h2 id="card-theme">Theme: Numbers</h2>
            <div id="bingo-grid" class="bingo-grid">
                <!-- Grid items generated by JS -->
            </div>
        </div>

        <button class="btn btn-large btn-success mt-md" onclick="resetGame()">New Card</button>

        <!-- Bingo Win Modal -->
        <div id="win-modal" class="modal-overlay">
            <div class="modal center-content">
                <div class="bingo-text">BINGO!</div>
                <p>Great job!</p>
                <button class="btn btn-primary" onclick="closeModal()">Keep Playing</button>
                <button class="btn btn-secondary" onclick="resetGame()">New Game</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
