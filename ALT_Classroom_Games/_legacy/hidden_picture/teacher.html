<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Mode - Hidden Picture</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .teacher-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: var(--space-xl) var(--space-lg);
        }

        .editor-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            margin-bottom: var(--space-lg);
            box-shadow: var(--shadow-md);
        }

        .form-group {
            margin-bottom: var(--space-md);
        }

        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 1rem;
        }

        .image-preview {
            width: 100%;
            height: 300px;
            background: #eee;
            border-radius: var(--radius-md);
            margin-top: var(--space-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px dashed #ccc;
        }

        .image-preview img {
            max-width: 100%;
            max-height: 100%;
            display: none;
        }

        .questions-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .question-item {
            background: #f8f9fa;
            padding: 0.5rem;
            border: 1px solid #dee2e6;
            border-radius: 4px;
        }

        .question-item label {
            font-size: 0.8rem;
            color: #666;
            display: block;
        }

        .question-item input {
            width: 100%;
            border: 1px solid #ccc;
            padding: 4px;
            font-size: 0.9rem;
        }

        .btn-group-saved {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
    </style>
</head>

<body>
    <header class="game-header" style="background: linear-gradient(135deg, #FF9F1C 0%, #FFBF69 100%);">
        <div class="container">
            <button class="btn-back" onclick="window.location.href='index.html'">← Back to Game</button>
            <h1>⚙️ Teacher Mode - Hidden Picture</h1>
        </div>
    </header>

    <div class="teacher-container">
        <!-- Editor -->
        <div class="editor-card">
            <div
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-lg);">
                <div style="flex: 1; margin-right: var(--space-md);">
                    <label class="form-label">Set Name</label>
                    <input type="text" id="set-name" class="form-input" placeholder="e.g. Unit 5 - Sports">
                </div>
                <div>
                    <button class="btn btn-secondary" onclick="newSet()">New</button>
                    <button class="btn btn-primary" onclick="saveSet()">💾 Save Set</button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Hidden Image URL</label>
                <div style="display: flex; gap: 1rem;">
                    <input type="text" id="image-url" class="form-input" placeholder="https://..."
                        onchange="updatePreview()">
                    <button class="btn btn-accent" onclick="document.getElementById('file-upload').click()">Upload
                        File</button>
                    <input type="file" id="file-upload" accept="image/*" style="display: none"
                        onchange="handleFileUpload(this)">
                </div>
                <div class="image-preview">
                    <span id="preview-text">Image Preview</span>
                    <img id="preview-img" src="" alt="Preview">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Questions (25 max for 5x5 grid)</label>
                <button class="btn btn-sm btn-secondary" onclick="generateDefaultQuestions()">Auto-Fill Numbers</button>
                <div id="questions-container" class="questions-list">
                    <!-- Javascript generates inputs here -->
                </div>
            </div>
        </div>

        <!-- Saved Sets -->
        <div class="editor-card">
            <h2>Saved Sets</h2>
            <div id="saved-list"></div>
        </div>

        <!-- Import/Export -->
        <div class="editor-card">
            <h2>Import / Export</h2>
            <textarea id="json-io" class="form-input" rows="3" placeholder="Paste JSON here..."></textarea>
            <div style="margin-top: 1rem;">
                <button class="btn btn-secondary" onclick="exportSets()">Export All</button>
                <button class="btn btn-accent" onclick="importSets()">Import</button>
            </div>
        </div>
    </div>

    <script>
        let currentSet = {
            id: null,
            name: '',
            image: '',
            questions: []
        };

        function init() {
            newSet();
            loadSavedList();
        }

        function createQuestionInputs() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            // Always show 25 inputs to be safe for 5x5
            for (let i = 0; i < 25; i++) {
                const val = currentSet.questions[i] || '';
                const div = document.createElement('div');
                div.className = 'question-item';
                div.innerHTML = `
                    <label>Tile ${i + 1}</label>
                    <input type="text" value="${val}" onchange="updateQuestion(${i}, this.value)" placeholder="Question ${i + 1}">
                `;
                container.appendChild(div);
            }
        }

        function updateQuestion(index, value) {
            currentSet.questions[index] = value;
        }

        function updatePreview() {
            const url = document.getElementById('image-url').value;
            const img = document.getElementById('preview-img');
            const txt = document.getElementById('preview-text');

            currentSet.image = url;

            if (url) {
                img.src = url;
                img.style.display = 'block';
                txt.style.display = 'none';
            } else {
                img.style.display = 'none';
                txt.style.display = 'block';
            }
        }

        function handleFileUpload(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const result = e.target.result;
                    document.getElementById('image-url').value = result; // Base64 handling
                    updatePreview();
                };
                reader.readAsDataURL(file);
            }
        }

        function generateDefaultQuestions() {
            for (let i = 0; i < 25; i++) {
                if (!currentSet.questions[i]) {
                    currentSet.questions[i] = `Question ${i + 1}`;
                    // Update input if exists
                    const inputs = document.querySelectorAll('.question-item input');
                    if (inputs[i]) inputs[i].value = `Question ${i + 1}`;
                }
            }
        }

        function saveSet() {
            const name = document.getElementById('set-name').value.trim();
            if (!name) return alert('Enter set name');
            if (!currentSet.image) return alert('Enter image URL');

            currentSet.name = name;
            currentSet.id = currentSet.id || 'custom_' + Date.now();

            // Filter empty questions out? No, keep index position

            const sets = getSavedSets();
            sets[currentSet.id] = currentSet;
            localStorage.setItem('hidden_picture_sets', JSON.stringify(sets));

            loadSavedList();
            alert('Saved!');
        }

        function getSavedSets() {
            const saved = localStorage.getItem('hidden_picture_sets');
            return saved ? JSON.parse(saved) : {};
        }

        function loadSavedList() {
            const sets = getSavedSets();
            const list = document.getElementById('saved-list');
            list.innerHTML = '';

            Object.keys(sets).forEach(key => {
                if (key === 'default') return; // Don't allow delete default
                const s = sets[key];
                const item = document.createElement('div');
                item.className = 'saved-item';
                item.style.padding = '1rem';
                item.style.background = '#f8f9fa';
                item.style.marginBottom = '0.5rem';
                item.style.borderRadius = 'var(--radius-md)';

                item.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center">
                        <strong>${s.name}</strong>
                        <div class="btn-group-saved">
                            <button class="btn btn-sm btn-accent" onclick="loadSet('${key}')">Edit</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteSet('${key}')">Delete</button>
                        </div>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function loadSet(id) {
            const sets = getSavedSets();
            if (sets[id]) {
                currentSet = JSON.parse(JSON.stringify(sets[id]));
                document.getElementById('set-name').value = currentSet.name;
                document.getElementById('image-url').value = currentSet.image;
                updatePreview();
                createQuestionInputs();
            }
        }

        function deleteSet(id) {
            if (!confirm('Delete?')) return;
            const sets = getSavedSets();
            delete sets[id];
            localStorage.setItem('hidden_picture_sets', JSON.stringify(sets));
            loadSavedList();
            if (currentSet.id === id) newSet();
        }

        function newSet() {
            currentSet = {
                id: null,
                name: '',
                image: '',
                questions: new Array(25).fill('')
            };
            document.getElementById('set-name').value = '';
            document.getElementById('image-url').value = '';
            updatePreview();
            createQuestionInputs();
        }

        function exportSets() {
            document.getElementById('json-io').value = JSON.stringify(getSavedSets(), null, 2);
        }

        function importSets() {
            try {
                const data = JSON.parse(document.getElementById('json-io').value);
                const current = getSavedSets();
                localStorage.setItem('hidden_picture_sets', JSON.stringify({ ...current, ...data }));
                loadSavedList();
                alert('Imported!');
            } catch (e) {
                alert('Invalid JSON');
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
