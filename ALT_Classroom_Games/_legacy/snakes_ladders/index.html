<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snakes & Ladders - Brain Power</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../global_setup.css">
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <script src="../utils/audio.js"></script>
</head>

<body>
    <header class="game-header header-snakes">
        <div class="container">
            <button class="btn-back" onclick="window.location.href='../index.html'">← Back to Hub</button>
            <h1>🐍 Snakes & Ladders 🪜</h1>
            <div class="right-actions">
                <button class="btn-icon" onclick="toggleMute()" title="Toggle Sound">🔊</button>
                <button class="btn-icon" onclick="window.location.href='teacher.html'" title="Teacher Mode">⚙️</button>
            </div>
        </div>
    </header>

    <!-- Setup Screen -->
    <div id="setup-screen" class="screen active">
        <div class="container text-center">
            <h2 class="mb-lg">Game Setup</h2>

            <div class="setup-card">
                <h3>Question Set</h3>
                <select id="game-set-select" class="input-select">
                    <option value="none">No Questions (Race Mode)</option>
                    <option value="demo">Demo Questions</option>
                </select>
            </div>

            <div class="setup-card">
                <h3>Number of Players</h3>
                <div class="team-buttons">
                    <button class="btn btn-accent team-count-btn active" data-teams="2" onclick="selectTeams(2, this)">2
                        Players</button>
                    <button class="btn btn-accent team-count-btn" data-teams="3" onclick="selectTeams(3, this)">3
                        Players</button>
                    <button class="btn btn-accent team-count-btn" data-teams="4" onclick="selectTeams(4, this)">4
                        Players</button>
                </div>
            </div>

            <button class="btn btn-large btn-primary mt-lg" onclick="startGame()">Start Game!</button>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen game-screen">
        <div class="container container-max">
            <!-- Top Controls Row -->
            <div class="controls-header">
                <div class="turn-panel">
                    <div id="current-player-display" class="player-badge p1">Player 1</div>
                    <span class="turn-label">'s Turn</span>
                </div>

                <div class="dice-area-compact">
                    <div id="dice-display" class="dice-compact">🎲</div>
                    <button id="roll-btn" class="btn btn-primary" onclick="rollDice()">ROLL</button>
                </div>

                <div class="players-list-row" id="players-list">
                    <!-- Player statuses horizontal -->
                </div>
            </div>

            <!-- Board Area -->
            <div class="board-container-centered">
                <div id="board" class="snakes-board">
                    <!-- Grid 100-1 generated by JS -->
                    <!-- Svg Overlay for Snakes/Ladders -->
                    <svg id="board-overlay" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                        <!-- Lines drawn here -->
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <!-- Question Modal -->
    <div id="question-modal" class="modal-overlay">
        <div class="modal text-center">
            <h2 id="modal-title">LADDER FOUND!</h2>
            <p style="margin-bottom: 1rem;">Answer correct to climb up!</p>

            <div class="question-box" id="question-text">
                What is the past tense of "Go"?
            </div>

            <div class="modal-actions">
                <button class="btn btn-success" onclick="handleAnswer(true)">Correct</button>
                <button class="btn btn-danger" onclick="handleAnswer(false)">Wrong</button>
            </div>
        </div>
    </div>

    <!-- Win Modal -->
    <div id="win-modal" class="modal-overlay">
        <div class="modal text-center">
            <h1>🏆 WE HAVE A WINNER! 🏆</h1>
            <h2 id="winner-name" style="color: gold; font-size: 3rem;">Player 1</h2>
            <div style="margin-top: 2rem;">
                <button class="btn btn-primary" onclick="location.reload()">Play Again</button>
                <button class="btn btn-secondary" onclick="window.location.href='../index.html'">Exit</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>

</html>
