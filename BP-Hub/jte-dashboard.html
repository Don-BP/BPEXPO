<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JTE Dashboard - BP LABO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .teacher-card {
            cursor: pointer;
            transition: transform 0.2s;
        }

        .teacher-card:hover {
            transform: translateY(-5px);
            border-color: var(--bp-blue);
        }

        .plan-item {
            cursor: pointer;
            border-left: 4px solid transparent;
        }

        .plan-item:hover {
            background-color: #f8f9fa;
            border-left-color: var(--bp-blue);
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-bp-blue sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="assets/images/logo-white.png" alt="BP LABO" height="40" class="me-2">
                <span class="fw-bold">BP LABO</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <span class="nav-link text-white" id="userWelcome">Welcome, Sensei</span>
                    </li>
                    <li class="nav-item ms-2">
                        <button class="btn btn-outline-light btn-sm" onclick="auth.logout()">Logout</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <h2 class="mb-4"><i class="bi bi-people-fill text-primary me-2"></i>Connected ALTs</h2>
        <p class="text-muted mb-5">Select an ALT to view lesson plans shared with you.</p>

        <!-- Loading State -->
        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <!-- ALT List -->
        <div id="altList" class="row g-4" style="display: none;">
            <!-- Cards will be injected here -->
        </div>

        <!-- Shared Plans Section (Hidden initially) -->
        <div id="plansSection" class="mt-5" style="display: none;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 id="selectedAltName">Plans from ALT</h3>
                <button class="btn btn-outline-secondary btn-sm" onclick="resetView()">Back to ALTs</button>
            </div>
            <div class="card shadow-sm">
                <div class="list-group list-group-flush" id="plansList">
                    <!-- Plans will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/jte-dashboard.js"></script>
</body>

</html>
