<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate Your Account - BP LABO</title>
    <link rel="icon" type="image/png" href="assets/bp_favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Arial', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; color: white; padding: 20px; position: relative; background: radial-gradient(rgb(220, 241, 255) 30%, rgba(0, 119, 255, 0.639) 80%); }
        body::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('assets/main-bg.jpg'); background-size: cover; background-position: center; opacity: 0.2; z-index: -1; }
        .container { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 20px; padding: 40px; max-width: 450px; width: 100%; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .title { font-size: 2rem; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .subtitle { font-size: 1rem; opacity: 0.8; margin-bottom: 30px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .form { display: flex; flex-direction: column; gap: 20px; }
        .form-input { width: 100%; padding: 12px; border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 10px; background: rgba(255, 255, 255, 0.1); color: white; font-size: 1.1rem; text-align: center; letter-spacing: 2px; text-transform: uppercase; }
        .form-input::placeholder { color: rgba(255, 255, 255, 0.7); }
        .btn { padding: 12px 30px; background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 10px; color: white; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: all 0.3s ease; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .message { padding: 10px; border-radius: 5px; margin-bottom: 15px; display: none; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .error-message { background: rgba(255, 0, 0, 0.2); border: 1px solid rgba(255, 0, 0, 0.4); color: white; }
        .success-message { background: rgba(0, 255, 0, 0.2); border: 1px solid rgba(0, 255, 0, 0.4); color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Activate Your Account</h1>
        <p class="subtitle">Enter the license code sent to your email address.</p>

        <div id="message-box" class="message"></div>

        <form id="activate-form" class="form">
            <input type="text" id="license-code" class="form-input" placeholder="BP-XXXX-XXXX" required>
            <button type="submit" class="btn" id="activate-btn">Activate Account</button>
        </form>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const activateForm = document.getElementById('activate-form');
            const licenseInput = document.getElementById('license-code');
            const messageBox = document.getElementById('message-box');
            const activateBtn = document.getElementById('activate-btn');

            activateForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const licenseCode = licenseInput.value.trim().toUpperCase();
                
                messageBox.style.display = 'none';
                messageBox.className = 'message';
                activateBtn.disabled = true;
                activateBtn.textContent = 'Activating...';

                try {
                    const response = await auth.activate(licenseCode);
                    messageBox.textContent = `${response.message} Redirecting to login...`;
                    messageBox.classList.add('success-message');
                    messageBox.style.display = 'block';

                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 3000);

                } catch (error) {
                    messageBox.textContent = `Activation Failed: ${error.message}`;
                    messageBox.classList.add('error-message');
                    messageBox.style.display = 'block';
                    activateBtn.disabled = false;
                    activateBtn.textContent = 'Activate Account';
                }
            });
        });
    </script>
</body>
</html>
